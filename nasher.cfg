# TODO: original cfg or this one, remove TODO comments after adding the details
[package]
# TODO: adjust - internal package name (no spaces/special characters)
name = "module"
# TODO: adjust - add short description
description = "New NWN Module"
version = "0.1"
url = ""

# global rules for file sorting
[package.rules]
"*.utc" = "src/module"
"*.utm" = "src/module"
"*.utp" = "src/module"
"*.ute" = "src/module"
"*.uti" = "src/module"
"*.itp" = "src/module"
"*.uts" = "src/module"
"*.utt" = "src/module"
"*.dlg" = "src/module"
"*.fac" = "src/module"
"*.jrl" = "src/module"
"*.are" = "src/module"
"*.git" = "src/module"
"*.gic" = "src/module"
"*.ifo" = "src/module"
"*.nss" = "src/module"
"*.tlk" = "src/tlk"
"*"     = "src/hak"

  [package.sources]
  include = "src/**/*.{nss,json}"

  [package.rules]
  "*" = "src/$ext"

# --- TARGET 1: The actual module ---
[target]
name = "default"
# TODO: adjust - Name of the generated .mod/.hak/.tlk file to represent the correct filename used in
# the toolset (the mod determines the name of the release zip, as the workflow automatically detects *.mod)
file = "module.mod"
group = "zip"
description = "Classic NWN module"

  [target.sources]
  include = "src/module/**/*.{nss,json}"

# --- TARGET 2: The HAK ---
# This target creates the .hak file, which is required for the module to be
# opened in editors at all
# TODO: file should correspond to the attached hak/tlk
[target]
name = "hak"
file = "module.hak"
group = "zip"
description = "The HAK for the module"

  [target.sources]
  # We are including all files from the HAK folder
  include = "src/hak/**/*"

# --- TARGET 3: The TLK ---
# This target creates the .tlk file, like the hak
# TODO: file should correspond to the attached hak/tlk.
[target]
name = "tlk"
description = "Custom talk file for the module"
file = "module.tlk"
group = "zip"

  [target.sources]
  include = "src/tlk/*.json"