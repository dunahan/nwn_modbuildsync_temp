name: create-release
'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_build:
    permissions:
      contents: write

    env:
      NWNSERVER_VERSION: "8193.37-17"
      NWN_ROOT: ${{ github.workspace }}/nwn
      NWN_HOME: ${{ github.workspace }}/nwn

    runs-on: ubuntu-latest
    name: 'NWN:EE CI Build'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # nasher requires a portion of the official NWN server data
      # (nwscript.nss, standard includes, etc.) to compile the scripts.
      - name: Cache NWN server data
        id: cache-nwn
        uses: actions/cache@v5
        with:
          path: ${{ env.NWN_ROOT }}
          key: nwn-server-${{ env.NWNSERVER_VERSION }}

      - name: Download NWN server data
        if: steps.cache-nwn.outputs.cache-hit != 'true'
        run: |
          wget -q "https://nwn.beamdog.net/downloads/nwnee-dedicated-${NWNSERVER_VERSION}.zip"
          mkdir -p "$NWN_ROOT"
          unzip -q "nwnee-dedicated-${NWNSERVER_VERSION}.zip" -d "$NWN_ROOT"
          rm "nwnee-dedicated-${NWNSERVER_VERSION}.zip"

      # "nimble install nasher" automatically builds neverwinter.nim (and thus
      # nwn_script_comp) as a dependency.
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Cache for ~/.nimble: nasher + neverwinter.nim are compiled from
      # source code, which takes a few minutes during the very first run.
      # With a cache hit, this step is skipped thereafter..
      - name: Cache nimble packages
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-nasher

      - name: Install nasher
        run: nimble install nasher -y

      # When installing 'nasher', 'nimble' also built its dependency, 'neverwinter.nim'
      # —including 'nwn_nwsync_write', which the 'nwsync_pages' job (further down)
      # requires. It is passed along here as an artifact, avoiding the need to download
      # or build it separately in that subsequent step.
      - name: Upload nwsync tools artifact
        uses: actions/upload-artifact@v7
        with:
          name: nwsync-tools
          path: ~/.nimble/bin/nwn_nwsync_write

      # this builds the group specified in nasher.cfg
      - name: Build module and components
        run: nasher pack zip

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> "$GITHUB_OUTPUT"

      # list up all created files and pack them up
      - name: Zip module contents
        id: zip
        run: |
          shopt -s nullglob
          MODFILES=(*.mod)
          if [ ${#MODFILES[@]} -eq 0 ]; then
            echo "No .mod file found – did the build fail?"
            exit 1
          fi
          MODFILE="${MODFILES[0]}"
          ZIPFILE="${MODFILE%.mod}.zip"
          
          # Start with the base list using the .mod file
          FILES=("$MODFILE")
          
          # Dynamically add existing .hak and .tlk files
          for f in *.hak *.tlk; do
            FILES+=("$f")
          done
          
          zip -j "$ZIPFILE" "${FILES[@]}"
          echo "zipfile=$ZIPFILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zipfile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pass on the built module files so that the nwsync job can reuse them.
      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-build-files
          path: |
            *.mod
            *.hak
            *.tlk

  # NEW: A separate job that creates an nwsync repository from the built module
  # and publishes it to GitHub Pages.
  #
  # Intentionally kept as a separate, independent job: should you decide to
  # switch to a different host later (e.g., your own server, S3, etc.), you
  # only need to replace the "Deploy to GitHub Pages" step (e.g., with rsync/scp
  # or rclone)—the build step using nwn_nwsync_write remains the same.
  nwsync_pages:
    needs: ci_build
    runs-on: ubuntu-latest
    name: 'NWSync Repo -> GitHub Pages'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built module
        uses: actions/download-artifact@v8
        with:
          name: module-build-files
          path: .

      - name: Download nwsync tools
        uses: actions/download-artifact@v8
        with:
          name: nwsync-tools
          path: nwsync_tools

      - name: Make nwsync tools executable
        run: chmod +x nwsync_tools/nwn_nwsync_write

      # The UUID comes from the repository variable MODULE_UUID (Settings -> Secrets and
      # variables -> Actions -> Variables). It must remain the same across all builds;
      # otherwise, each version will be treated as an entirely new module
      # rather than an update. Generate it once, for example, using:
      # python3 -c "import uuid; print(uuid.uuid4())"
      - name: Build nwsync repository
        run: |
          MODFILE=$(ls *.mod | head -n1)
          mkdir -p nwsync_output

          # Collect all .hak and .tlk files in the workspace
          ADDITIONAL_FILES=()
          for f in *.hak *.tlk; do
            if [ -f "$f" ]; then
              ADDITIONAL_FILES+=("$f")
            fi
          done

          # Execute nwn_nwsync_write with the module and all discovered HAKs/TLKs
          ./nwsync_tools/nwn_nwsync_write \
            --path . \
            --with-module \
            --mod-uuid="${{ vars.MODULE_UUID }}" \
            nwsync_output/ \
            "$MODFILE" \

          # Prevents GitHub Pages from filtering/modifying the folder
          # structure (data/, manifests/) via Jekyll.
          touch nwsync_output/.nojekyll

          # Include a static placeholder image (stored permanently in the repo;
          # not part of the generated build output).
          mkdir -p nwsync_output/assets
          cp assets/header_image.jpg nwsync_output/assets/header_image.jpg

      # repository.json (build output in nwsync_output/) is populated using the
      # repository.json template maintained within the repository (at the repo root) —
      # with the addition of only those values that depend on the build time
      # (UUID from a repository variable, version hash, timestamp, and
      # contact/author information derived from the repository owner).
      - name: Fill in repository.json with build data
        env:
          MODULE_UUID: ${{ vars.MODULE_UUID }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, time, pathlib

          repo = json.loads(pathlib.Path("repository.json").read_text())

          manifest_hash = pathlib.Path("nwsync_output/latest").read_text().strip()
          created_at = int(time.time())
          version_label = time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(created_at))

          repo["contact"] = f"https://github.com/{os.environ['REPO_OWNER']}"
          repo["modules"][0]["uuid"] = os.environ["MODULE_UUID"]
          repo["modules"][0]["author"] = os.environ["REPO_OWNER"]
          repo["modules"][0]["versions"] = [
              {
                  "identifier": manifest_hash,
                  "version": version_label,
                  "created_at": created_at,
              }
          ]

          pathlib.Path("nwsync_output/repository.json").write_text(
              json.dumps(repo, indent=2)
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: nwsync_output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
